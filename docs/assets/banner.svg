<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" fill="none">
  <defs>
    <linearGradient id="titleGrad" x1="0" y1="0" x2="1200" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#818cf8"/>
      <stop offset="45%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#22d3ee"/>
    </linearGradient>
    <linearGradient id="lineGrad" x1="0" y1="0" x2="1200" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0"/>
      <stop offset="50%" stop-color="#22d3ee"/>
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="circuitGrad" x1="0" y1="0" x2="1200" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#22d3ee" stop-opacity="0.5"/>
    </linearGradient>
    <radialGradient id="glowIndigo" cx="0.18" cy="0.5" r="0.9" gradientUnits="objectBoundingBox">
      <stop offset="0%" stop-color="#4f46e5" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#4f46e5" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowCyan" cx="0.82" cy="0.5" r="0.9" gradientUnits="objectBoundingBox">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0"/>
    </radialGradient>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="1" stroke-opacity="0.5"/>
    </pattern>
  </defs>

  <!-- background -->
  <rect width="1200" height="320" rx="28" fill="#070b18"/>
  <rect width="1200" height="320" rx="28" fill="url(#grid)" opacity="0.35"/>
  <rect width="1200" height="320" rx="28" fill="url(#glowIndigo)" transform="translate(0 0) scale(1)"/>
  <rect x="600" width="600" height="320" fill="url(#glowCyan)"/>

  <!-- circuit traces -->
  <g stroke="url(#circuitGrad)" stroke-width="1.5" fill="none" opacity="0.7">
    <polyline points="60,250 140,250 140,190 210,190"/>
    <circle cx="210" cy="190" r="3.5" fill="#22d3ee" stroke="none"/>
    <polyline points="1140,70 1060,70 1060,120 990,120"/>
    <circle cx="990" cy="120" r="3.5" fill="#6366f1" stroke="none"/>
    <polyline points="70,90 70,60 130,60"/>
    <circle cx="130" cy="60" r="3.5" fill="#818cf8" stroke="none"/>
    <polyline points="1130,240 1130,270 1070,270"/>
    <circle cx="1070" cy="270" r="3.5" fill="#22d3ee" stroke="none"/>
  </g>

  <!-- floating orbs (robot eyes motif) -->
  <circle cx="340" cy="120" r="5" fill="#22d3ee" filter="url(#softGlow)"/>
  <circle cx="860" cy="120" r="5" fill="#818cf8" filter="url(#softGlow)"/>

  <!-- wordmark -->
  <text x="600" y="168" text-anchor="middle" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="120" font-weight="800" letter-spacing="-2" fill="url(#titleGrad)" filter="url(#softGlow)">NexaHome</text>

  <!-- tagline -->
  <text x="600" y="222" text-anchor="middle" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="26" font-weight="400" letter-spacing="6" fill="#94a3b8">YOUR HOME. CONNECTED. INTELLIGENT.</text>

  <!-- divider -->
  <rect x="400" y="250" width="400" height="2" rx="1" fill="url(#lineGrad)"/>
  <text x="600" y="286" text-anchor="middle" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="17" font-weight="500" letter-spacing="2" fill="#64748b">Cukup katakan <tspan fill="#22d3ee" font-weight="600">Hi Nexa</tspan>.</text>
</svg>
