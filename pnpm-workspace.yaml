packages:
  - "apps/*"
  - "packages/*"
  - "integrations/*"

# Override versi untuk menutup advisory `pnpm audit` (Fase E.4).
#   - postcss      : dipin next@15.5.26 ke 8.4.31 (GHSA-qx2v-qp2m-jg93, GHSA-fxqj-rqcc-2cmp, GHSA-6g55-p6wh-862q)
#   - deepmerge-ts : dipin @prisma/config ke 7.1.5 (GHSA-ggr8-5vv4-36mx)
overrides:
  postcss: ^8.5.23
  deepmerge-ts: ^8.0.0

allowBuilds:
  '@parcel/watcher': true
  '@prisma/client': true
  '@prisma/engines': true
  '@swc/core': true
  prisma: true
  unrs-resolver: true

# Nonaktifkan gate "rilis terlalu baru" (default 1440 menit / 24 jam) karena
# banyak dependensi (NestJS 12.1.1, turbo 2.11.5, dll.) baru rilis <24 jam
# saat repo ini di-scaffold. Bisa dikembalikan ke nilai default nanti.
minimumReleaseAge: 0
