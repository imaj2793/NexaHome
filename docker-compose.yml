# NexaHome — full stack produksi.
#
#   cp .env.example .env    # lalu ganti JWT_SECRET (minimal 32 karakter)
#                            # dan INTEGRATION_CREDENTIALS_KEY (openssl rand -base64 32)
#   ./scripts/mqtt-tls.sh    # CA, sertifikat server, dan password broker
#   docker compose up -d --build
#
# Script TLS harus jalan sebelum `up`: listener 8883/443 butuh sertifikat dan
# password file, dan compose memount CA ke API. Certificate file yang belum ada
# akan dibuat Docker sebagai direkt kosong, bukan ditolak.
#
# Web  : http://localhost:${WEB_PORT:-3000}
# API  : http://localhost:${API_PORT:-3001}/api/health
# MQTT : mqtts://localhost:8883 · wss://localhost:443  (butuh ./scripts/mqtt-tls.sh)
#
# Broker punya tiga listener:
#   1883  mqtt://  plaintext tanpa auth → hanya jaringan internal compose
#   8883  mqtts:// TLS + password        → perangkat dan klien di jaringan lokal
#   443   wss://   TLS + WebSocket       → browser dan klien yang terhalang port
#                                          non-standar (mis. sandbox browser)
#
# API memakai mqtts:// lewat jaringan internal dengan sertifikat CA repo,
# supaya kredensial broker tidak lagi melewati jaringan dalam plaintext.
#
# `migrate` adalah service one-shot: menjalankan `prisma migrate deploy`
# lalu keluar dengan status 0. API baru start setelah migrasi sukses.

name: nexahome

services:
  postgres:
    image: postgres:16-alpine
    container_name: nexahome-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-nexahome}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-nexahome}
      POSTGRES_DB: ${POSTGRES_DB:-nexahome}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-nexahome} -d ${POSTGRES_DB:-nexahome}"]
      interval: 5s
      timeout: 5s
      retries: 10

  mqtt:
    image: eclipse-mosquitto:2
    container_name: nexahome-mqtt
    restart: unless-stopped
    ports:
      # 1883 hanya untuk host, dan hanya di loopback: jangan dipakai dari luar
      # mesin ini. Klien di jaringan lain memakai 8883.
      - "127.0.0.1:${MQTT_PLAINTEXT_PORT:-1883}:1883"
      - "${MQTT_TLS_PORT:-8883}:8883"
      # Port 443 privileged, jadi publish di sisi host. Di dalam container
      # mosquitto tetap listen di 8884 supaya tidak butuh root untuk bind.
      - "${MQTT_WS_PORT:-443}:8884"
    volumes:
      - ./docker/mosquitto/config:/mosquitto/config
      # DibacaOnly: broker tidak perlu menulis ke direktori sertifikat.
      - ./docker/mosquitto/certs:/mosquitto/certs:ro
      - mqtt_data:/mosquitto/data
    healthcheck:
      test: ["CMD-SHELL", "mosquitto_pub -h 127.0.0.1 -p 1883 -t 'nexahome/health' -m ping -q true || exit 0"]
      interval: 15s
      timeout: 10s
      retries: 3

  # Migrasi database sekali jalan (ganti image migrate bila schema berubah).
  migrate:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      target: migrate
    container_name: nexahome-migrate
    restart: "no"
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-nexahome}:${POSTGRES_PASSWORD:-nexahome}@postgres:5432/${POSTGRES_DB:-nexahome}?schema=public
    depends_on:
      postgres:
        condition: service_healthy

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      target: runner
    image: nexahome/api:local
    container_name: nexahome-api
    restart: unless-stopped
    environment:
      NODE_ENV: production
      API_PORT: 3001
      DATABASE_URL: postgresql://${POSTGRES_USER:-nexahome}:${POSTGRES_PASSWORD:-nexahome}@postgres:5432/${POSTGRES_DB:-nexahome}?schema=public
      # Wajib diisi: nilai default di .env.example ditolak oleh validateEnv.
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET wajib diisi. Jalankan `cp .env.example .env` lalu ganti nilainya (minimal 32 karakter).}
      INTEGRATION_CREDENTIALS_KEY: ${INTEGRATION_CREDENTIALS_KEY:?INTEGRATION_CREDENTIALS_KEY wajib diisi (openssl rand -base64 32).}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-7d}
      JWT_REFRESH_EXPIRES_DAYS: ${JWT_REFRESH_EXPIRES_DAYS:-30}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:3000}
      TRUST_PROXY: ${TRUST_PROXY:-0}
      AUTH_RATE_LIMIT_MAX: ${AUTH_RATE_LIMIT_MAX:-10}
      AUTH_RATE_LIMIT_WINDOW_MS: ${AUTH_RATE_LIMIT_WINDOW_MS:-60000}
      AI_PROVIDER: ${AI_PROVIDER:-mock}
      AI_API_KEY: ${AI_API_KEY:-}
      AI_BASE_URL: ${AI_BASE_URL:-https://api.deepseek.com/v1}
      AI_MODEL: ${AI_MODEL:-deepseek-chat}
      # Broker mosquitto selalu dinyalakan oleh compose ini, jadi adapter MQTT
      # memakai mode nyata. Untuk demo tanpa broker, tambahkan
      # `MQTT_MODE: mock` lewat docker-compose.override.yml.
      MQTT_URL: ${DOCKER_MQTT_URL:-mqtts://mqtt:8883}
      MQTT_MODE: mqtt
      # Sertifikat broker dibuat oleh scripts/mqtt-tls.sh. CA-nya ikut
      # di-inject ke image API supaya hostname `mqtt` terbaca sebagai SAN, dan
      # API memverifikasi sertifikat broker sungguhan — bukan `--insecure`.
      MQTT_TLS_CA_PATH: /run/nexahome/mqtt-ca.pem
      MQTT_USERNAME: ${MQTT_USERNAME:-}
      MQTT_PASSWORD: ${MQTT_PASSWORD:-}
      # CA sudah di-inject, jadi verifikasi tetap hidup. Set false hanya bila
      # memakai CA yang tidak sengaja diubah tanpa memberi API CA baru.
      MQTT_TLS_REJECT_UNAUTHORIZED: "true"
      # Tasmota butuh mDNS ke jaringan LAN, yang sulit dijangkau dari
      # container bridge, jadi default-nya mock (scan kosong).
      TASMOTA_MODE: ${TASMOTA_MODE:-mock}
      # whisper.cpp/ffmpeg tidak dibundel di image API; STT aktif bila biner
      # dan model tersedia di container (lihat docs/DEPLOYMENT.md).
      WHISPER_BIN: ${WHISPER_BIN:-}
      WHISPER_MODEL: ${WHISPER_MODEL:-}
      WHISPER_LANG: ${WHISPER_LANG:-id}
    ports:
      - "${API_PORT:-3001}:3001"
    volumes:
      # Hanya CA publik. Private key CA dan private key broker tidak pernah
      # masuk container API.
      - ./docker/mosquitto/ca/ca.crt:/run/nexahome/mqtt-ca.pem:ro
    depends_on:
      postgres:
        condition: service_healthy
      mqtt:
        condition: service_started
      migrate:
        condition: service_completed_successfully

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      # NEXT_PUBLIC_* di-inline saat build → argumen wajib, bukan env runtime.
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:3001/api}
    image: nexahome/web:local
    container_name: nexahome-web
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-3000}:3000"
    depends_on:
      api:
        condition: service_healthy

volumes:
  postgres_data:
  mqtt_data:
