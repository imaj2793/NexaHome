name: Release

# Jalankan dengan membuat & mendorong tag versi:
#   git tag v0.2.0 && git push origin v0.2.0
# Workflow ini membangun image, mendorong ke GHCR, dan membuat GitHub Release.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag yang akan dilepas (mis. v0.2.0)"
        required: true

permissions:
  contents: write
  packages: write

jobs:
  release:
    name: build & publish image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ghcr.io/${{ github.repository }}/api
            ghcr.io/${{ github.repository }}/web
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest

      - name: Build & push image API
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile
          target: runner
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build & push image Web
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/web/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Ringkasan ukuran image
        run: |
          {
            echo "### Ukuran image"
            echo '```'
            echo "${{ steps.meta.outputs.tags }}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Buat GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          body: |
            Jalankan dengan `docker compose up -d` (lihat `docs/DEPLOYMENT.md`).

            ```bash
            curl -fsSL -o compose.yml \
              https://raw.githubusercontent.com/${{ github.repository }}/${GITHUB_REF_NAME}/docker-compose.yml
            curl -fsSL -o .env \
              https://raw.githubusercontent.com/${{ github.repository }}/${GITHUB_REF_NAME}/.env.example
            sed -i '' "s|^JWT_SECRET=.*|JWT_SECRET=\"$(openssl rand -hex 32)\"|" .env
            docker compose up -d
            ```

            Login seed (opsional): `pnpm docker:seed` → owner@nexahome.local / password123
