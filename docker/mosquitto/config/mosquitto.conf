# NexaHome — broker MQTT (mosquitto).
#
# Tiga listener, tiga tujuan berbeda:
#
#   1883  mqtt://  plaintext, tanpa auth   → hanya jaringan internal compose
#   8883  mqtts:// TLS, dengan password     → perangkat & klien di jaringan lokal
#   8884  wss://   TLS + WebSocket          → dipublish sebagai 443 di host,
#                                             untuk browser dan klien yang
#                                             hanya boleh lewat port standar
#
# Sertifikat dan password file dibuat oleh scripts/mqtt-tls.sh:
#
#   ./scripts/mqtt-tls.sh
#
# Tanpa file itu, listener TLS gagal start dengan error "cannot load
# certificate file". 1883 tetap jalan, jadi compose tidak langsung mati.

# Opsi keamanan berlaku per listener, bukan global. Tanpa `per_listener_settings`
# (dan `listener_allow_anonymous` di bawah) aturan 8883/8884 akan ikut menutup
# 1883 — dan container API memakai 1883 lewat jaringan internal.
#
# `per_listener_settings` akan dihapus di mosquitto 3.0 karena semua opsi
# keamanan jadi per-listener secara default; baris ini hanya untuk versi 2.x.
# `allow_anonymous` juga sudah diganti `listener_allow_anonymous`.
per_listener_settings true

# ── 1883: internal compose ──────────────────────────────
# Tidak dipublikasikan lewat docker-compose (port Mapping hanya 127.0.0.1),
# jadi plaintext di sini tidak melewati batas container. Jangan tambahkan
# mapping ke 0.0.0.0.
listener 1883
protocol mqtt
listener_allow_anonymous true

# ── 8883: MQTT over TLS ─────────────────────────────────
# `tls_version` diulang per listener karena `per_listener_settings true`:
# versi TLS adalah properti listener, bukan global. tlsv1.2 adalah batas bawah
# (TLS 1.3 tetap aktif), bukan batas atas.
listener 8883
protocol mqtt
listener_allow_anonymous false
password_file /mosquitto/config/passwd
certfile /mosquitto/certs/server.crt
keyfile /mosquitto/certs/server.key
tls_version tlsv1.2

# ── 8884: WebSocket over TLS ────────────────────────────
# Port 443 ada di sisi host (docker compose publish 443:8884). Di dalam
# container mosquitto tetap listen di 8884 supaya tidak perlu bind port
# privileged, dan supaya user mosquitto bisa menjalankan broker tanpa root.
listener 8884
protocol websockets
listener_allow_anonymous false
password_file /mosquitto/config/passwd
certfile /mosquitto/certs/server.crt
keyfile /mosquitto/certs/server.key
tls_version tlsv1.2

persistence true
persistence_location /mosquitto/data/

# Log ke stdout supaya `docker compose logs mqtt` berguna; tanpa ini mosquitto
# menulis ke file di dalam container yang tidak pernah dibaca.
log_dest stdout
log_type error
log_type warning
log_type notice
connection_messages true

# Broker tidak butuh privileged port di dalam container (semanya di bawah
# 1024 dan publish-nya di sisi host), jadi langsung drop ke user mosquitto.
user mosquitto